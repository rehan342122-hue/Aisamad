<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aisamad AI assistant"><title>Aisamad — AI Assistant</title>
<style>
:root{--bg:#fff;--panel:#f7f7f8;--text:#202123;--muted:#6b6b6b;--line:#e5e5e5;--brand:#10a37f;--bubble:#f4f4f4;--dark:#202123}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.shell{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--dark);color:#fff;padding:12px;display:flex;flex-direction:column;gap:12px}.brand{font-size:20px;font-weight:700;padding:10px}.new{background:transparent;color:#fff;border:1px solid #555;text-align:left}.history{flex:1;overflow:auto;display:grid;gap:5px}.history button{background:transparent;color:#ddd;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px;border-radius:7px}.history button:hover{background:#343541}.side-bottom{border-top:1px solid #444;padding-top:10px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top h1{font-size:16px;margin:0}.top-actions{display:flex;gap:8px;align-items:center}.top button,.top select,.modal button,.modal input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;color:var(--text)}.chat{width:min(850px,100%);margin:auto;flex:1;overflow:auto;padding:28px 20px 150px}.welcome{text-align:center;margin:18vh auto 0}.welcome h2{font-size:32px;margin:0 0 10px}.welcome p{color:var(--muted)}.row{display:flex;gap:16px;margin:26px 0;line-height:1.65}.avatar{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;flex:none;background:var(--brand);color:#fff;font-weight:700}.row.user .avatar{background:#666}.content{white-space:pre-wrap;overflow-wrap:anywhere;max-width:760px}.composer-wrap{position:fixed;bottom:0;left:260px;right:0;background:linear-gradient(transparent,var(--bg) 28%);padding:35px 20px 22px}.composer{width:min(850px,100%);margin:auto;display:flex;gap:8px;border:1px solid #c7c7c7;border-radius:13px;padding:8px;background:var(--bg);box-shadow:0 2px 10px #00000012}.composer textarea{flex:1;border:0;outline:0;resize:none;min-height:25px;max-height:150px;padding:8px;background:transparent;color:var(--text);font:inherit}.send{background:var(--brand)!important;color:#fff!important;border:0!important;border-radius:8px;padding:8px 13px}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}.status{position:fixed;top:68px;right:20px;color:#b42318;background:#fff5f5;border-radius:7px;padding:8px 12px;display:none;max-width:360px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:3}.modal-card{background:var(--bg);width:min(400px,100%);padding:24px;border-radius:14px}.modal input{display:block;width:100%;margin:9px 0}.modal .primary{background:var(--brand);color:#fff;border:0}.hidden{display:none!important}@media(max-width:700px){.sidebar{width:58px;padding:8px}.sidebar .brand{font-size:0;padding:8px}.sidebar .brand:first-letter{font-size:20px}.sidebar .new{font-size:0;text-align:center}.sidebar .new:first-letter{font-size:20px}.history,.side-bottom{display:none}.composer-wrap{left:58px}.top{padding:0 12px}.chat{padding-left:14px;padding-right:14px}.welcome h2{font-size:26px}}
</style></head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">🤖 Aisamad</div><button class="new" id="newBtn">＋ New chat</button><div id="history" class="history"></div><div class="side-bottom"><button class="new" id="loginBtn">⇥ Login</button></div></aside>
<main class="main"><header class="top"><h1>Aisamad</h1><div class="top-actions"><select id="language"><option value="auto">Auto</option><option value="hi">हिन्दी</option><option value="en">English</option></select><button id="theme">☾</button><button id="logout" class="hidden">Logout</button></div></header><div id="chat" class="chat"><div class="welcome"><h2>What can I help with?</h2><p>Hindi ya English mein kuch bhi poochho.</p></div></div><div id="error" class="status"></div><div class="composer-wrap"><form id="form" class="composer"><textarea id="message" rows="1" placeholder="Message Aisamad..." autocomplete="off"></textarea><button class="send" id="send">↑</button></form><div class="hint">Aisamad can make mistakes. Important information verify kar lena.</div></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle">Login to Aisamad</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="primary" id="authSubmit">Login</button><button id="authToggle">Create account</button><button id="guestBtn">Continue as guest</button><p id="authError" style="color:#b42318"></p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const $=s=>document.querySelector(s);let auth=null,user=null,token=null,authMode='login',mode='general',current=null,chats=[];const guestKey='aisamad-chat';
function showError(text){const e=$('#error');e.textContent=text;e.style.display='block';setTimeout(()=>e.style.display='none',7000)}
function fresh(){current={id:null,title:'New chat',messages:[]};render();}
function render(){const el=$('#chat');el.innerHTML='';if(!current?.messages?.length){el.innerHTML='<div class="welcome"><h2>What can I help with?</h2><p>Hindi ya English mein kuch bhi poochho.</p></div>';return}current.messages.forEach(m=>{const row=document.createElement('div');row.className='row '+m.role;row.innerHTML='<div class="avatar">'+(m.role==='user'?'U':'A')+'</div><div class="content"></div>';row.querySelector('.content').textContent=m.text;el.appendChild(row)});el.scrollTop=el.scrollHeight}
function saveGuest(){localStorage.setItem(guestKey,JSON.stringify(current))}function headers(){return token?{Authorization:'Bearer '+token}: {}}
async function api(url,options={}){options.headers={...(options.headers||{}),...headers(),'Content-Type':'application/json'};const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Server error');return d}
async function cloudSave(){if(!user)return;if(!current.id){const d=await api('/api/conversations',{method:'POST',body:JSON.stringify({title:current.title})});current.id=d.conversation.id}await api('/api/conversations/'+current.id,{method:'PUT',body:JSON.stringify({title:current.title,messages:current.messages})});loadHistory()}
async function loadHistory(){if(!user)return;try{const d=await api('/api/conversations');chats=d.conversations;$('#history').innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title||'New chat';b.onclick=async()=>{current=(await api('/api/conversations/'+c.id)).conversation;render()};$('#history').appendChild(b)})}catch(e){showError(e.message)}}
async function send(e){e.preventDefault();const input=$('#message'),text=input.value.trim();if(!text)return;input.value='';current.messages.push({role:'user',text});if(current.title==='New chat')current.title=text.slice(0,40);render();$('#send').disabled=true;try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text,history:current.messages.slice(-18),language:$('#language').value,mode})});current.messages.push({role:'ai',text:d.reply});user?await cloudSave():saveGuest();render()}catch(err){current.messages=current.messages.filter(m=>m.text!==text);render();showError(err.message)}finally{$('#send').disabled=false;input.focus()}}
async function setup(){try{const d=await fetch('/api/config').then(r=>r.json());if(d.firebase?.apiKey&&d.firebase?.projectId){firebase.initializeApp(d.firebase);auth=firebase.auth();auth.onAuthStateChanged(async u=>{user=u;if(u){token=await u.getIdToken();$('#loginBtn').textContent=u.email;$('#logout').classList.remove('hidden');$('#modal').classList.add('hidden');await loadHistory()}else{token=null;$('#logout').classList.add('hidden')}})}}catch(e){console.warn(e)}}
async function authSubmit(){try{if(authMode==='login')await auth.signInWithEmailAndPassword($('#email').value,$('#password').value);else await auth.createUserWithEmailAndPassword($('#email').value,$('#password').value);$('#authError').textContent=''}catch(e){$('#authError').textContent=e.message}}
$('#form').onsubmit=send;$('#newBtn').onclick=fresh;$('#loginBtn').onclick=()=>user?null:$('#modal').classList.remove('hidden');$('#guestBtn').onclick=()=>$('#modal').classList.add('hidden');$('#authSubmit').onclick=authSubmit;$('#authToggle').onclick=()=>{authMode=authMode==='login'?'register':'login';$('#modalTitle').textContent=authMode==='login'?'Login to Aisamad':'Create Aisamad account';$('#authSubmit').textContent=authMode==='login'?'Login':'Register'};$('#logout').onclick=()=>auth.signOut();$('#theme').onclick=()=>{document.documentElement.style.setProperty('--bg',getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#fff'?'#343541':'#fff');document.documentElement.style.setProperty('--text',getComputedStyle(document.documentElement).getPropertyValue('--text').trim()==='#202123'?'#fff':'#202123')};$('#message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e)}});current=JSON.parse(localStorage.getItem(guestKey)||'null')||{id:null,title:'New chat',messages:[]};render();setup();
</script></body></html>
