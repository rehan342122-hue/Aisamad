<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aisamad</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f7fb; color: #172033; }
    main { max-width: 760px; margin: 40px auto; padding: 24px; }
    h1 { margin-bottom: 4px; } .sub { color: #667085; }
    #chat { min-height: 380px; background: white; border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px #17203312; }
    .msg { padding: 12px 14px; margin: 10px 0; border-radius: 12px; white-space: pre-wrap; }
    .user { background: #e7f0ff; margin-left: 12%; } .ai { background: #eef8ee; margin-right: 12%; }
    form { display: flex; gap: 10px; margin-top: 16px; } textarea { flex: 1; resize: vertical; padding: 12px; border: 1px solid #ccd3df; border-radius: 10px; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 0 20px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body><main>
  <h1>🤖 Aisamad</h1><div class="sub">Tumhara apna Gemini-powered AI assistant</div>
  <section id="chat"><div class="msg ai">Namaste! Main Aisamad hoon. Aaj main aapki kaise madad kar sakta hoon?</div></section>
  <form id="form"><textarea id="message" rows="2" placeholder="Apna message likho..." required></textarea><button id="send">Bhejo</button></form>
</main>
<script>
const form = document.querySelector('#form'), input = document.querySelector('#message'), chat = document.querySelector('#chat'), send = document.querySelector('#send');
function add(text, cls) { const el = document.createElement('div'); el.className = `msg ${cls}`; el.textContent = text; chat.appendChild(el); chat.scrollTop = chat.scrollHeight; }
form.addEventListener('submit', async e => { e.preventDefault(); const message = input.value.trim(); if (!message) return; add(message, 'user'); input.value = ''; send.disabled = true;
  try { const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message}) }); const data = await r.json(); add(data.reply || `Error: ${data.error || 'Unknown error'}`, 'ai'); }
  catch (_) { add('Network error. Server check karo.', 'ai'); } finally { send.disabled = false; input.focus(); }
});
</script></body></html>
