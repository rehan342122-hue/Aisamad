<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aisamad — a premium Hindi-friendly AI assistant"><title>Aisamad — Premium AI</title><style>
:root{--bg:#0b1020;--panel:#11182b;--panel2:#151e35;--line:#273452;--text:#edf3ff;--muted:#91a0bd;--brand:#7c6cff;--brand2:#26d9b5;--user:#27335b;--shadow:0 24px 70px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,#263875 0,#0b1020 60%);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:278px;background:#0c1326dd;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}.logo{font-weight:800;font-size:21px;letter-spacing:-.5px;padding:6px 8px}.logo span{color:var(--brand2)}button,select,textarea,input{font:inherit;color:inherit}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:#6876a4;transform:translateY(-1px)}.new{width:100%;text-align:left;background:linear-gradient(135deg,#7c6cff,#5365ef);border:0;font-weight:700;box-shadow:0 10px 25px #625cf644}.history{display:grid;gap:6px;overflow:auto}.history button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:9px;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover{background:var(--panel2);color:var(--text)}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0e1629aa;backdrop-filter:blur(16px)}.top-title{font-weight:750;font-size:16px}.top-sub{font-size:12px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:8px;align-items:center}.tools select,.tools button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}.chat{width:min(900px,100%);flex:1;overflow:auto;margin:auto;padding:40px 25px 160px}.welcome{text-align:center;margin:15vh auto 0}.orb{width:68px;height:68px;margin:0 auto 22px;border-radius:24px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 15px 45px #625cf666;display:grid;place-items:center;font-size:31px}.welcome h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px;letter-spacing:-1.5px}.welcome p{color:var(--muted);font-size:16px}.row{display:flex;gap:14px;margin:28px 0;line-height:1.7}.avatar{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#08101e}.user .avatar{background:#526184;color:#fff}.content{max-width:780px;white-space:pre-wrap;overflow-wrap:anywhere}.user .content{background:var(--user);padding:12px 15px;border-radius:16px 16px 4px 16px}.composer-wrap{position:fixed;bottom:0;left:278px;right:0;padding:35px 25px 22px;background:linear-gradient(transparent,#0b1020 35%)}.composer{width:min(900px,100%);margin:auto;display:flex;gap:8px;align-items:end;border:1px solid #354467;background:#151e35eF;border-radius:17px;padding:9px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}textarea{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:27px;max-height:150px;padding:9px;color:var(--text)}.send{width:42px;height:42px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),#5867ee);font-size:20px;cursor:pointer}.hint{text-align:center;color:#71809c;font-size:11px;margin-top:10px}.toast{position:fixed;top:86px;right:24px;max-width:370px;background:#361b28;color:#ffd7df;border:1px solid #8a3e55;padding:12px 15px;border-radius:12px;display:none;z-index:4}.modal{position:fixed;inset:0;background:#050814bb;display:grid;place-items:center;padding:20px;z-index:5}.card{width:min(410px,100%);padding:27px;border:1px solid var(--line);background:var(--panel);border-radius:20px;box-shadow:var(--shadow)}.card h2{margin-top:0}.card input{width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:10px}.card button{margin:7px 5px 0 0}.primary{background:linear-gradient(135deg,var(--brand),#5867ee);border:0}.hidden{display:none!important}@media(max-width:700px){.side{width:65px;padding:13px 8px}.logo{font-size:0}.logo:first-letter{font-size:22px}.new{font-size:0;text-align:center;padding:12px 5px}.new:first-letter{font-size:20px}.history,.side-foot{display:none}.composer-wrap{left:65px;padding:28px 12px 16px}.top{padding:0 14px}.top-sub{display:none}.chat{padding:25px 14px 145px}.tools select{max-width:76px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">✦ <span>Aisamad</span></div><button id="new" class="btn new">＋ New chat</button><div id="history" class="history"></div><div class="side-foot">Private • Helpful • Hindi-first</div></aside><main class="main"><header class="top"><div><div class="top-title">Aisamad AI</div><div class="top-sub">Your thoughtful everyday assistant</div></div><div class="tools"><select id="lang"><option value="auto">Auto</option><option value="hi">हिन्दी</option><option value="en">English</option></select><button class="btn" id="theme">☼</button><button class="btn hidden" id="logout">Logout</button><button class="btn" id="login">Login</button></div></header><section id="chat" class="chat"><div class="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>Hindi ya English mein kuch bhi poochho.</p></div></section><div id="toast" class="toast"></div><div class="composer-wrap"><form id="form" class="composer"><textarea id="message" rows="1" placeholder="Message Aisamad..." autocomplete="off"></textarea><button id="send" class="send" aria-label="Send">↑</button></form><div class="hint">Aisamad can make mistakes. Important information verify kar lena.</div></div></main></div><div id="modal" class="modal hidden"><div class="card"><h2 id="modalTitle">Welcome back</h2><p style="color:var(--muted)">Login karke apni chats cloud mein save karo.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="btn primary" id="authSubmit">Login</button><button class="btn" id="toggle">Create account</button><button class="btn" id="guest">Continue as guest</button><p id="authError" style="color:#ff9eac"></p></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>
const $=s=>document.querySelector(s);let current=null,user=null,token=null,auth=null,register=false;const guestKey='aisamad-premium-chat';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',7000)}function fresh(){current={id:null,title:'New chat',messages:[]};render()}function render(){const c=$('#chat');c.innerHTML='';if(!current.messages.length){c.innerHTML='<div class="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>Hindi ya English mein kuch bhi poochho.</p></div>';return}current.messages.forEach(m=>{const r=document.createElement('div');r.className='row '+m.role;r.innerHTML='<div class="avatar">'+(m.role==='user'?'U':'✦')+'</div><div class="content"></div>';r.querySelector('.content').textContent=m.text;c.appendChild(r)});c.scrollTop=c.scrollHeight}function headers(){return token?{Authorization:'Bearer '+token}:{}}async function api(u,o={}){o.headers={...(o.headers||{}),...headers(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server error');return d}async function save(){localStorage.setItem(guestKey,JSON.stringify(current));if(!user)return;if(!current.id){const d=await api('/api/conversations',{method:'POST',body:JSON.stringify({title:current.title})});current.id=d.conversation.id}await api('/api/conversations/'+current.id,{method:'PUT',body:JSON.stringify({title:current.title,messages:current.messages})});loadHistory()}async function loadHistory(){if(!user)return;try{const d=await api('/api/conversations');$('#history').innerHTML='';d.conversations.forEach(x=>{const b=document.createElement('button');b.textContent=x.title||'New chat';b.onclick=async()=>{current=(await api('/api/conversations/'+x.id)).conversation;render()};$('#history').appendChild(b)})}catch(e){toast(e.message)}}async function send(e){e.preventDefault();const i=$('#message'),text=i.value.trim();if(!text)return;i.value='';current.messages.push({role:'user',text});if(current.title==='New chat')current.title=text.slice(0,40);render();$('#send').disabled=true;try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text,history:current.messages.slice(0,-1).slice(-18),language:$('#lang').value})});current.messages.push({role:'ai',text:d.reply});await save();render()}catch(err){current.messages.pop();render();toast(err.message)}finally{$('#send').disabled=false;i.focus()}}async function setup(){try{const c=await fetch('/api/config').then(r=>r.json());if(c.firebase?.apiKey){firebase.initializeApp(c.firebase);auth=firebase.auth();auth.onAuthStateChanged(async u=>{user=u;if(u){token=await u.getIdToken();$('#login').textContent=u.email;$('#logout').classList.remove('hidden');$('#modal').classList.add('hidden');await loadHistory()}else{token=null;$('#logout').classList.add('hidden')}})}}catch(e){console.warn(e)}}async function authGo(){try{if(register)await auth.createUserWithEmailAndPassword($('#email').value,$('#password').value);else await auth.signInWithEmailAndPassword($('#email').value,$('#password').value)}catch(e){$('#authError').textContent=e.message}}$('#form').onsubmit=send;$('#new').onclick=fresh;$('#login').onclick=()=>$('#modal').classList.remove('hidden');$('#guest').onclick=()=>$('#modal').classList.add('hidden');$('#authSubmit').onclick=authGo;$('#toggle').onclick=()=>{register=!register;$('#modalTitle').textContent=register?'Create account':'Welcome back';$('#authSubmit').textContent=register?'Register':'Login';$('#toggle').textContent=register?'Already have account? Login':'Create account'};$('#logout').onclick=()=>auth.signOut();$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e)}};$('#theme').onclick=()=>document.body.classList.toggle('light');current=JSON.parse(localStorage.getItem(guestKey)||'null')||{id:null,title:'New chat',messages:[]};render();setup();
</script></body></html>
