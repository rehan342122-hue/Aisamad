<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Kiyara AI — a premium Hindi-friendly AI assistant">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/kiyara-logo.svg" type="image/svg+xml">
  <title>Kiyara AI — Premium Assistant</title>
  <style>
    :root{--bg:#0a1020;--panel:#10192e;--panel2:#17233d;--line:#293858;--text:#f4f7ff;--muted:#9aa9c5;--brand:#8b7cff;--cyan:#38e1c0;--user:#293862;--danger:#ff9cab;--shadow:0 24px 70px #0006}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,#2a3978 0,#0a1020 62%);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:280px;background:#0b1326e8;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-size:21px;font-weight:800;letter-spacing:-.6px}.brand img{width:30px;height:30px}.brand em{font-style:normal;color:var(--cyan)}button,select,textarea,input{font:inherit;color:inherit}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 13px;cursor:pointer;transition:.18s}.btn:hover{border-color:#7281ad;transform:translateY(-1px)}.new{width:100%;text-align:left;background:linear-gradient(135deg,var(--brand),#5367ee);border:0;font-weight:750;box-shadow:0 10px 25px #625cf644}.history{display:grid;gap:6px;overflow:auto}.history button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:9px;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover{background:var(--panel2);color:var(--text)}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0e1629b8;backdrop-filter:blur(16px)}.top-title{font-weight:800;font-size:16px}.top-sub{font-size:12px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:8px;align-items:center}.tools select,.tools button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}.chat{width:min(900px,100%);flex:1;overflow:auto;margin:auto;padding:40px 25px 175px}.welcome{text-align:center;margin:14vh auto 0}.orb{width:76px;height:76px;margin:0 auto 22px;border-radius:26px;background:linear-gradient(135deg,var(--brand),var(--cyan));box-shadow:0 15px 45px #625cf666;display:grid;place-items:center}.orb img{width:47px;height:47px}.welcome h1{font-size:clamp(29px,5vw,45px);margin:0 0 10px;letter-spacing:-1.6px}.welcome p{color:var(--muted);font-size:16px}.row{display:flex;gap:14px;margin:28px 0;line-height:1.7}.avatar{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#08101e;font-size:12px;font-weight:800}.user .avatar{background:#526184;color:#fff}.content{max-width:780px;white-space:pre-wrap;overflow-wrap:anywhere}.user .content{background:var(--user);padding:12px 15px;border-radius:16px 16px 4px 16px}.attachment{max-width:280px;border-radius:12px;margin-bottom:8px;display:block;border:1px solid #ffffff22}.composer-wrap{position:fixed;bottom:0;left:280px;right:0;padding:35px 25px 22px;background:linear-gradient(transparent,#0a1020 35%)}.composer{width:min(900px,100%);margin:auto;display:flex;gap:7px;align-items:end;border:1px solid #354467;background:#151e35ee;border-radius:17px;padding:9px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}textarea{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:27px;max-height:150px;padding:9px;color:var(--text)}.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-size:19px}.icon-btn:hover{background:#ffffff12}.send{background:linear-gradient(135deg,var(--brand),#5867ee);font-size:20px}.file-name{max-width:900px;margin:0 auto 6px;color:var(--cyan);font-size:12px;padding-left:8px}.hint{text-align:center;color:#71809c;font-size:11px;margin-top:10px}.toast{position:fixed;top:86px;right:24px;max-width:370px;background:#361b28;color:#ffd7df;border:1px solid #8a3e55;padding:12px 15px;border-radius:12px;display:none;z-index:4}.hidden{display:none!important}@media(max-width:700px){.side{width:65px;padding:13px 8px}.brand{font-size:0;padding:5px}.brand img{width:25px;height:25px}.new{font-size:0;text-align:center;padding:12px 5px}.new:first-letter{font-size:20px}.history,.side-foot{display:none}.composer-wrap{left:65px;padding:28px 12px 16px}.top{padding:0 14px}.top-sub{display:none}.chat{padding:25px 14px 145px}.tools select{max-width:76px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><img src="/kiyara-logo.svg" alt="Kiyara logo"><span>Kiyara <em>AI</em></span></div><button id="new" class="btn new">＋ New chat</button><div id="history" class="history"></div><div class="side-foot">Private • Helpful • Hindi-first</div></aside>
  <main class="main"><header class="top"><div><div class="top-title">Kiyara AI</div><div class="top-sub">Your thoughtful everyday assistant</div></div><div class="tools"><select id="lang"><option value="auto">Auto</option><option value="hi">हिन्दी</option><option value="en">English</option></select><button class="btn" id="install" hidden>Install</button><button class="btn" id="login">Login</button><button class="btn hidden" id="logout">Logout</button></div></header>
    <section id="chat" class="chat"><div class="welcome"><div class="orb"><img src="/kiyara-logo.svg" alt=""></div><h1>What can I help with?</h1><p>Hindi ya English mein kuch bhi poochho — image bhi bhej sakte ho.</p></div></section><div id="toast" class="toast"></div>
    <div class="composer-wrap"><div id="fileName" class="file-name"></div><form id="form" class="composer"><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button type="button" class="icon-btn" id="attach" title="Attach image">＋</button><button type="button" class="icon-btn" id="mic" title="Voice input">⌕</button><textarea id="message" rows="1" placeholder="Message Kiyara..." autocomplete="off"></textarea><button id="send" class="icon-btn send" aria-label="Send">↑</button></form><div class="hint">Kiyara can make mistakes. Important information verify kar lena.</div></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="card"><h2 id="modalTitle">Welcome back</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="btn primary" id="authSubmit">Login</button><button class="btn" id="toggle">Create account</button><button class="btn" id="guest">Continue as guest</button><p id="authError"></p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const $=s=>document.querySelector(s);let current=null,user=null,token=null,auth=null,register=false,selectedImage=null;const guestKey='kiyara-chat';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',7000)}function fresh(){current={id:null,title:'New chat',messages:[]};render()}function render(){const c=$('#chat');c.innerHTML='';if(!current.messages.length){c.innerHTML='<div class="welcome"><div class="orb"><img src="/kiyara-logo.svg" alt=""></div><h1>What can I help with?</h1><p>Hindi ya English mein kuch bhi poochho — image bhi bhej sakte ho.</p></div>';return}current.messages.forEach(m=>{const r=document.createElement('div');r.className='row '+m.role;r.innerHTML='<div class="avatar">'+(m.role==='user'?'U':'✦')+'</div><div class="content"></div>';if(m.image){const im=document.createElement('img');im.className='attachment';im.src=m.image;r.querySelector('.content').appendChild(im)}const text=document.createTextNode(m.text||'');r.querySelector('.content').appendChild(text);c.appendChild(r)});c.scrollTop=c.scrollHeight}function headers(){return token?{Authorization:'Bearer '+token}:{}}async function api(u,o={}){o.headers={...(o.headers||{}),...headers(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server error');return d}function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}async function send(e){e.preventDefault();const i=$('#message'),text=i.value.trim();if(!text&&!selectedImage)return;i.value='';const image=selectedImage;current.messages.push({role:'user',text,image:image?.data});if(current.title==='New chat')current.title=(text||'Image chat').slice(0,40);render();$('#send').disabled=true;try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text||'Please analyse this image.',image:image?{mimeType:image.type,data:image.data}:undefined,history:current.messages.slice(0,-1).slice(-18),language:$('#lang').value})});current.messages.push({role:'ai',text:d.reply});localStorage.setItem(guestKey,JSON.stringify(current));render()}catch(err){current.messages.pop();render();toast(err.message)}finally{selectedImage=null;$('#fileName').textContent='';$('#send').disabled=false;i.focus()}}async function setup(){try{const c=await fetch('/api/config').then(r=>r.json());if(c.firebase?.apiKey){firebase.initializeApp(c.firebase);auth=firebase.auth();auth.onAuthStateChanged(async u=>{user=u;if(u){token=await u.getIdToken();$('#login').textContent=u.email;$('#logout').classList.remove('hidden');$('#modal').classList.add('hidden')}else{token=null;$('#logout').classList.add('hidden')}})}}catch(e){console.warn(e)}}async function authGo(){try{if(register)await auth.createUserWithEmailAndPassword($('#email').value,$('#password').value);else await auth.signInWithEmailAndPassword($('#email').value,$('#password').value)}catch(e){$('#authError').textContent=e.message}}$('#form').onsubmit=send;$('#new').onclick=fresh;$('#attach').onclick=()=>$('#image').click();$('#image').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>6*1024*1024)return toast('Image 6 MB se chhoti honi chahiye.');selectedImage={type:f.type,data:await readImage(f)};$('#fileName').textContent='Attached: '+f.name};$('#mic').onclick=()=>{const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return toast('Voice input is not supported in this browser.');const r=new Speech();r.lang=$('#lang').value==='en'?'en-US':'hi-IN';r.onresult=e=>{$('#message').value=e.results[0][0].transcript};r.start()};$('#login').onclick=()=>$('#modal').classList.remove('hidden');$('#guest').onclick=()=>$('#modal').classList.add('hidden');$('#authSubmit').onclick=authGo;$('#toggle').onclick=()=>{register=!register;$('#modalTitle').textContent=register?'Create account':'Welcome back';$('#authSubmit').textContent=register?'Register':'Login'};$('#logout').onclick=()=>auth.signOut();$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e)}};let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};current=JSON.parse(localStorage.getItem(guestKey)||'null')||{id:null,title:'New chat',messages:[]};render();setup();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
