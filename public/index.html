<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aisamad - professional Hindi-friendly AI assistant" />
  <title>Aisamad — AI Assistant</title>
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #172033; --muted: #667085; --border: #dce3ee; --primary: #2563eb;
      --primary-soft: #dfeaff; --user: #e7f0ff; --ai: #eef8ee; --danger: #d11a2a; --shadow: rgba(23, 32, 51, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0f1728; --card: #172234; --text: #f2f7ff; --muted: #a9b7ca; --border: #2c3a4f; --primary: #5ea0ff;
      --primary-soft: #163155; --user: #1e365d; --ai: #183d2d; --danger: #ff6b6b; --shadow: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); transition: all 0.2s ease;
    }
    button, select, textarea {
      font: inherit;
    }
    .app {
      max-width: 1200px; margin: 0 auto; min-height: 100vh; padding: 20px 16px 40px;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); }
    .subtitle { color: var(--muted); margin-top: 4px; font-size: 0.96rem; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar select, .toolbar button, .primary-btn, .secondary-btn {
      border-radius: 10px; padding: 9px 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
    }
    .primary-btn {
      background: var(--primary); color: #fff; border: 0; font-weight: 700;
    }
    .secondary-btn {
      background: var(--primary-soft); color: var(--text); border: 1px solid transparent;
    }
    .layout {
      display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px;
    }
    .sidebar, .chat-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 8px 28px var(--shadow);
    }
    .sidebar {
      padding: 14px;
      min-height: 540px;
      display: flex; flex-direction: column;
      gap: 12px;
    }
    .sidebar h3 {
      margin: 8px 0 6px; font-size: 1rem;
    }
    .session-list {
      display: flex; flex-direction: column; gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }
    .session-item {
      padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: transparent; cursor: pointer; text-align: left; color: var(--text);
    }
    .session-item.active {
      background: var(--primary-soft); border-color: transparent;
    }
    .session-item small {
      display: block; color: var(--muted); margin-top: 4px;
    }
    .chat-panel {
      display: flex; flex-direction: column; min-height: 540px; overflow: hidden;
    }
    .mode-row {
      display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; border-bottom: 1px solid var(--border);
    }
    .mode-btn {
      border: 1px solid var(--border); background: transparent; color: var(--text); padding: 7px 10px; border-radius: 10px; cursor: pointer;
    }
    .mode-btn.active {
      background: var(--primary); color: #fff; border-color: transparent;
    }
    #chat {
      flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px;
      background: rgba(255,255,255,0.01);
    }
    .msg {
      display: flex; gap: 8px; align-items: flex-end; max-width: 86%; padding: 12px 14px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap;
    }
    .msg.user { margin-left: auto; background: var(--user); }
    .msg.ai { margin-right: auto; background: var(--ai); }
    .msg-content {
      flex: 1; overflow-wrap: anywhere;
    }
    .msg-content h1, .msg-content h2, .msg-content h3 { margin: 0.5em 0; }
    .msg-content p { margin: 0.45em 0; }
    .msg-content pre {
      background: rgba(0,0,0,0.05); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 10px 0;
    }
    .msg-content code {
      background: rgba(0,0,0,0.05); padding: 2px 5px; border-radius: 6px; font-size: 0.92em;
    }
    .msg-content ul, .msg-content ol { margin: 0.6em 0 0.6em 1.2em; }
    .msg-actions {
      display: flex; gap: 6px; opacity: 0.8; margin-left: 4px;
    }
    .mini-btn {
      border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; padding: 4px 7px; cursor: pointer; font-size: 0.76rem;
    }
    .composer {
      padding: 14px 14px 18px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1; min-height: 58px; max-height: 180px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; resize: vertical; background: var(--card); color: var(--text);
    }
    .danger { color: var(--danger); }
    .status {
      color: var(--muted); font-size: 0.8rem; padding: 0 14px 12px; min-height: 18px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { min-height: unset; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <h1>🤖 Aisamad</h1>
        <div class="subtitle">Professional Hindi-friendly AI assistant</div>
      </div>
      <div class="toolbar">
        <select id="language">
          <option value="auto">Auto</option>
          <option value="hi">हिन्दी</option>
          <option value="en">English</option>
        </select>
        <button id="themeBtn" type="button">🌙</button>
        <button id="newSessionBtn" type="button">+ New chat</button>
        <button id="exportBtn" type="button">Export</button>
        <label class="secondary-btn" style="display:inline-flex; align-items:center; cursor:pointer;">
          <input id="importInput" type="file" accept="application/json" style="display:none;" />
          Import
        </label>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <h3>Chats</h3>
        <div id="sessionList" class="session-list"></div>
      </aside>

      <main class="chat-panel">
        <div class="mode-row" id="modeRow">
          <button type="button" class="mode-btn active" data-mode="general">General</button>
          <button type="button" class="mode-btn" data-mode="study">Study</button>
          <button type="button" class="mode-btn" data-mode="code">Code</button>
          <button type="button" class="mode-btn" data-mode="support">Support</button>
        </div>

        <div id="chat" aria-live="polite"></div>
        <div id="status" class="status">Ready</div>

        <div class="composer">
          <textarea id="message" rows="2" placeholder="Apna message likho..." aria-label="Message"></textarea>
          <button id="sendBtn" type="button" class="primary-btn">Send</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const messageEl = document.getElementById('message');
    const statusEl = document.getElementById('status');
    const sessionListEl = document.getElementById('sessionList');
    const languageSelect = document.getElementById('language');
    const modeButtons = [...document.querySelectorAll('.mode-btn')];
    const themeBtn = document.getElementById('themeBtn');
    const newSessionBtn = document.getElementById('newSessionBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importInput = document.getElementById('importInput');
    const sendBtn = document.getElementById('sendBtn');

    const STORAGE_KEY = 'aisamad-sessions';
    const DEFAULT_MODE = 'general';
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activeSessionId = null;
    let mode = DEFAULT_MODE;
    let abortController = null;

    function slugify(text) {
      return (text || 'New chat').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'new-chat';
    }

    function dateLabel(dateString) {
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return 'Now';
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function defaultSession() {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : `session-${Date.now()}`,
        title: 'New chat',
        mode: DEFAULT_MODE,
        language: 'auto',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        messages: [{ role: 'ai', text: 'Namaste! Main Aisamad hoon. Aaj main aapki kaise madad kar sakta hoon?' }]
      };
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function ensureActiveSession() {
      if (!sessions.length) {
        const s = defaultSession();
        sessions.push(s);
        activeSessionId = s.id;
        saveSessions();
      }
      const found = sessions.find(s => s.id === activeSessionId) || sessions[0];
      activeSessionId = found.id;
      mode = found.mode || DEFAULT_MODE;
      languageSelect.value = found.language || 'auto';
      setModeButtons();
      renderSessions();
      renderMessages();
    }

    function setModeButtons() {
      modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    }

    function renderSessions() {
      sessionListEl.innerHTML = '';
      sessions.slice().reverse().forEach(session => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'session-item' + (session.id === activeSessionId ? ' active' : '');
        item.innerHTML = `<div>${escapeHtml(session.title || 'Untitled chat')}</div><small>${dateLabel(session.updatedAt)}</small>`;
        item.addEventListener('click', () => {
          activeSessionId = session.id;
          const found = sessions.find(s => s.id === activeSessionId);
          if (found) {
            mode = found.mode || DEFAULT_MODE;
            languageSelect.value = found.language || 'auto';
            setModeButtons();
            renderSessions();
            renderMessages();
          }
        });
        sessionListEl.appendChild(item);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMarkdown(text) {
      const escaped = escapeHtml(text);
      const withBreaks = escaped
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>');
      let html = withBreaks;
      html = html.replace(/\*(.+?)\*/g, '<strong>$1</strong>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/^<p>|<\/p>$/g, '');
      return html;
    }

    function renderMessages() {
      const session = sessions.find(s => s.id === activeSessionId) || sessions[0];
      if (!session) return;
      chatEl.innerHTML = '';
      session.messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = `msg ${msg.role}`;

        const content = document.createElement('div');
        content.className = 'msg-content';
        content.innerHTML = renderMarkdown(msg.text || '');

        wrapper.appendChild(content);

        if (msg.role === 'ai') {
          const actions = document.createElement('div');
          actions.className = 'msg-actions';

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'mini-btn';
          copyBtn.textContent = 'Copy';
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(msg.text);
              statusEl.textContent = 'Answer copied.';
            } catch {
              statusEl.textContent = 'Copy failed.';
            }
          });

          const speakBtn = document.createElement('button');
          speakBtn.type = 'button';
          speakBtn.className = 'mini-btn';
          speakBtn.textContent = 'Speak';
          speakBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
              const utterance = new SpeechSynthesisUtterance(msg.text);
              utterance.lang = languageSelect.value === 'hi' ? 'hi-IN' : (languageSelect.value === 'en' ? 'en-US' : 'hi-IN');
              window.speechSynthesis.cancel();
              window.speechSynthesis.speak(utterance);
            }
          });

          actions.appendChild(copyBtn);
          actions.appendChild(speakBtn);
          wrapper.appendChild(actions);
        }

        chatEl.appendChild(wrapper);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function getActiveSession() {
      return sessions.find(s => s.id === activeSessionId) || sessions[0];
    }

    function updateSessionMeta(session, newMessageText) {
      const title = session.title === 'New chat' ? newMessageText.slice(0, 28).trim() || 'New chat' : session.title;
      session.title = title;
      session.updatedAt = new Date().toISOString();
      session.mode = mode;
      session.language = languageSelect.value;
      saveSessions();
      renderSessions();
    }

    function generateSessionSummary(text) {
      return text.trim().split(/\s+/).slice(0, 6).join(' ') || 'Chat';
    }

    function addMessage(role, text) {
      const session = getActiveSession();
      if (!session) return;
      session.messages.push({ role, text });
      const summary = generateSessionSummary(text);
      if (session.title === 'New chat' || session.title.length < 4) {
        session.title = summary;
      }
      session.updatedAt = new Date().toISOString();
      session.mode = mode;
      session.language = languageSelect.value;
      saveSessions();
      renderSessions();
      renderMessages();
    }

    async function sendMessage() {
      const text = messageEl.value.trim();
      if (!text) return;

      const session = getActiveSession();
      if (!session) return;

      session.messages.push({ role: 'user', text });
      session.updatedAt = new Date().toISOString();
      session.mode = mode;
      session.language = languageSelect.value;
      saveSessions();
      renderSessions();
      renderMessages();

      messageEl.value = '';
      statusEl.textContent = 'Aisamad is responding...';
      sendBtn.disabled = true;
      abortController = new AbortController();

      const tempAi = document.createElement('div');
      tempAi.className = 'msg ai';
      tempAi.innerHTML = '<div class="msg-content">Thinking…</div>';
      chatEl.appendChild(tempAi);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: session.messages.slice(-18),
            mode,
            language: languageSelect.value,
            model: 'gemini-2.0-flash'
          }),
          signal: abortController.signal
        });

        const data = await response.json();
        const answer = data.reply || `Error: ${data.error || 'Unknown error'}`;
        session.messages = session.messages.filter(item => !(item.role === 'ai' && item.text === 'Thinking…'));
        session.messages.push({ role: 'ai', text: answer });
        session.updatedAt = new Date().toISOString();
        session.title = session.title === 'New chat' ? generateSessionSummary(text) : session.title;
        saveSessions();
        renderSessions();
        renderMessages();
        statusEl.textContent = 'Reply ready.';
      } catch (error) {
        if (error.name !== 'AbortError') {
          session.messages = session.messages.filter(item => !(item.role === 'ai' && item.text === 'Thinking…'));
          session.messages.push({ role: 'ai', text: 'Connection issue. Check server and try again.' });
          saveSessions();
          renderMessages();
          statusEl.textContent = 'Connection issue.';
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    function createNewSession() {
      const session = defaultSession();
      sessions.push(session);
      activeSessionId = session.id;
      saveSessions();
      renderSessions();
      renderMessages();
      statusEl.textContent = 'New chat started.';
    }

    function exportSessions() {
      const data = JSON.stringify(sessions, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'aisamad-export.json';
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Chat export started.';
    }

    function importSessions(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!Array.isArray(parsed)) throw new Error('Invalid file');
          sessions = parsed;
          if (!sessions.length) {
            sessions.push(defaultSession());
          }
          activeSessionId = sessions[sessions.length - 1].id;
          saveSessions();
          ensureActiveSession();
          statusEl.textContent = 'Import complete.';
        } catch {
          statusEl.textContent = 'Invalid import file.';
        }
      };
      reader.readAsText(file);
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        setModeButtons();
        const session = getActiveSession();
        if (session) {
          session.mode = mode;
          saveSessions();
        }
      });
    });

    newSessionBtn.addEventListener('click', createNewSession);
    exportBtn.addEventListener('click', exportSessions);
    importInput.addEventListener('change', e => importSessions(e.target.files[0]));
    sendBtn.addEventListener('click', sendMessage);
    messageEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = dark ? '' : 'dark';
      themeBtn.textContent = dark ? '🌙' : '☀️';
    });

    languageSelect.addEventListener('change', () => {
      const session = getActiveSession();
      if (session) {
        session.language = languageSelect.value;
        saveSessions();
      }
    });

    ensureActiveSession();
    messageEl.focus();
  </script>
</body>
</html>
